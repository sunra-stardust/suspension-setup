name: Release

# Tag a release: `git tag v0.1.0 && git push origin v0.1.0`.
# Builds a signed release APK and publishes it to a GitHub Release for manual sideload install.
# No in-app updater (app is fully offline, no INTERNET permission — spec §11) — updates are a
# manual re-download + re-install, which only works cleanly if every release is signed with the
# same key. Requires these repo secrets:
#   RELEASE_KEYSTORE_BASE64   - base64 of the release keystore (.jks)
#   RELEASE_KEYSTORE_PASSWORD - keystore password
#   RELEASE_KEY_ALIAS         - key alias
#   RELEASE_KEY_PASSWORD      - key password
on:
  push:
    tags: [ 'v*' ]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so versionCode = commit count is stable

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      - name: Derive version
        id: ver
        run: |
          echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Decode keystore (optional)
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "::notice::Signing with the configured release keystore."
          else
            echo "::warning::No RELEASE_KEYSTORE_BASE64 secret — building a DEBUG-signed release APK. It installs fine, but a later signed release won't upgrade-install over it without uninstalling first."
          fi

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease \
            -PversionName=${{ steps.ver.outputs.name }} \
            -PversionCode=${{ steps.ver.outputs.code }} \
            --stacktrace

      - name: Prepare release asset
        run: |
          APK="$(find app/build/outputs/apk/release -name '*.apk' | head -1)"
          cp "$APK" "suspension-setup-${{ steps.ver.outputs.name }}.apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "suspension-setup-${{ steps.ver.outputs.name }}.apk" \
            --title "${GITHUB_REF_NAME}" --generate-notes
