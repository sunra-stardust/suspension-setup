name: PR check

# Tests for pull requests against main — mainly the catalog research routine's review PRs, whose
# [catalog-review] pushes skip ship.yml and would otherwise reach the owner untested.
# Publishes nothing; the merge onto main ships through ship.yml as usual.
on:
  pull_request:
    branches: [ main ]

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  research:
    name: Research data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 scripts/research.py check

  harness:
    name: Harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 scripts/test_harness.py

  verify:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew verify --stacktrace
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
